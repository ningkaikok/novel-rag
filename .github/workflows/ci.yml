name: CI

# push 到 main、以及所有指向 main 的 PR 时自动跑，挡住破坏构建的改动。
on:
  push:
    branches:
      - main
      # changelog workflow 里 bot 用默认 GITHUB_TOKEN 开的 PR 不会触发
      # pull_request 事件（GitHub 的防递归设计），导致那个 PR 上一个检查都没有、
      # 而 main 又要求必需检查通过 → 永久卡在 BLOCKED 无法合并。
      # 这里显式监听该分支的 push，让 bot 推分支时 CI 就跑起来，检查有了就能合并。
      - chore/auto-changelog
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: TypeScript 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

  e2e:
    name: 前端 e2e 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 运行 e2e 测试
        # 所有 /api/* 请求在测试里被 mock（见 e2e/mock-api.ts），
        # 不需要 PostgreSQL、Ollama 或任何云端 key，纯前端渲染验证。
        working-directory: frontend
        run: npx playwright test
      - name: 上传测试报告（失败时留痕）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend:
    name: 后端导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 导入后端（捕获语法错误、坏 import、模块级异常）
        # backend.main 在导入时不会连数据库、也不会下载模型，
        # 这两件事都发生在 FastAPI lifespan 里，所以纯导入是安全且快速的冒烟检查。
        run: python -c "import backend.main; print('backend import OK')"

  notify:
    name: 飞书通知
    runs-on: ubuntu-latest
    # needs 三个检查 job 的结果；if: always() 保证不管它们成功/失败/取消都会执行，
    # 这样失败也能通知到，不只是成功才通知。
    needs: [frontend, e2e, backend]
    if: always()
    steps:
      # 通用逻辑抽成了独立仓库，方便其他项目复用：
      # https://github.com/ningkaikok/feishu-notify-action
      # 没配置这两个 repo secret 时会直接跳过（exit 0），不会让这个 job 变红。
      # 配置方法见 CONTRIBUTING.md「CI 构建通知」。
      - uses: ningkaikok/feishu-notify-action@v1
        with:
          webhook-url: ${{ secrets.FEISHU_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          results: |
            {
              "前端类型检查": "${{ needs.frontend.result }}",
              "前端 e2e 测试": "${{ needs.e2e.result }}",
              "后端导入检查": "${{ needs.backend.result }}"
            }
