name: CI

# push 到 main、以及所有指向 main 的 PR 时自动跑，挡住破坏构建的改动。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端（lint + 格式 + 单测 + 类型）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"  # vite8 / playwright1.62 要求 ≥20.19，与本地 nvm 22 对齐
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci
      # 前端 job 同时需要 Python 工具链：类型契约的源头在 FastAPI 的 Pydantic 模型里
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安装后端依赖（导出 OpenAPI 用）
        run: uv sync --frozen
      - name: 类型契约 drift 检查（改了 Pydantic 必须重新生成）
        # 重新导出+生成后与提交内容 diff：有差异说明后端模型改了但没同步前端类型，
        # 直接标红——字段漂移从「靠 tsc 偶然发现」变成「PR 上必现」
        run: |
          uv run python scripts/export_openapi.py
          cd frontend && npm run gen:api
          cd .. && git diff --exit-code -- frontend/openapi.json frontend/src/api-generated.ts
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Prettier 格式检查
        working-directory: frontend
        run: npm run format:check
      - name: 依赖漏洞审计（npm audit，high 以上才挡）
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Vitest 单元测试 + 覆盖率
        working-directory: frontend
        run: npm run test:coverage
      - name: TypeScript 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

  e2e:
    name: 前端 e2e 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"  # vite8 / playwright1.62 要求 ≥20.19，与本地 nvm 22 对齐
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 运行 e2e 测试
        # 所有 /api/* 请求在测试里被 mock（见 e2e/mock-api.ts），
        # 不需要 PostgreSQL、Ollama 或任何云端 key，纯前端渲染验证。
        working-directory: frontend
        run: npx playwright test
      - name: 上传测试报告（失败时留痕）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend:
    name: 后端（lint + 类型增量 + 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          # uv.lock 是唯一事实来源：CI 用 --frozen 确保没人手改依赖没更新锁
          enable-cache: true
      - name: 安装依赖（uv sync --frozen）
        run: uv sync --frozen
      - name: Ruff lint + 格式检查
        run: |
          uv run ruff check src backend scripts tests
          uv run ruff format --check src backend scripts tests
      - name: Pyright 增量门禁（存量在基线内，只拦新增）
        run: uv run python scripts/pyright_check.py
      - name: 导入后端（捕获语法错误、坏 import、模块级异常）
        # backend.main 在导入时不会连数据库、也不会下载模型，
        # 这两件事都发生在 FastAPI lifespan 里，所以纯导入是安全且快速的冒烟检查。
        run: uv run python -c "import backend.main; print('backend import OK')"
      - name: 依赖漏洞审计（pip-audit）
        # 扫描 .venv 里实际安装的包；有已知 CVE 直接标红
        run: uv run pip-audit
      - name: 运行 pytest + 覆盖率（单元测试，不依赖真实数据库/模型）
        # tests/backend/ 下的用例全部用 mock/monkeypatch，不需要真实
        # PostgreSQL、Ollama 或任何云端 key。
        # 用 python -m 而不是裸 pytest：后者不把仓库根加进 sys.path，
        # 顶层导入 backend/config 依赖 cwd（与本地行为一致）
        # 覆盖率只做观测基线，不设硬门槛。
        run: uv run python -m pytest --cov --cov-report=term-missing

  notify:
    name: 飞书通知
    runs-on: ubuntu-latest
    # needs 三个检查 job 的结果；if: always() 保证不管它们成功/失败/取消都会执行，
    # 这样失败也能通知到，不只是成功才通知。
    needs: [frontend, e2e, backend]
    if: always()
    steps:
      # 通用逻辑抽成了独立仓库，方便其他项目复用：
      # https://github.com/ningkaikok/feishu-notify-action
      # 没配置这两个 repo secret 时会直接跳过（exit 0），不会让这个 job 变红。
      # 配置方法见 CONTRIBUTING.md「CI 构建通知」。
      - uses: ningkaikok/feishu-notify-action@v1
        with:
          webhook-url: ${{ secrets.FEISHU_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          results: |
            {
              "前端 lint/单测/类型": "${{ needs.frontend.result }}",
              "前端 e2e 测试": "${{ needs.e2e.result }}",
              "后端 lint/类型/测试": "${{ needs.backend.result }}"
            }
