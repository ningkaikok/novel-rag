name: CI

# push 到 main、以及所有指向 main 的 PR 时自动跑，挡住破坏构建的改动。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: 前端类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: TypeScript 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

  e2e:
    name: 前端 e2e 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 安装 Playwright 浏览器
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: 运行 e2e 测试
        # 所有 /api/* 请求在测试里被 mock（见 e2e/mock-api.ts），
        # 不需要 PostgreSQL、Ollama 或任何云端 key，纯前端渲染验证。
        working-directory: frontend
        run: npx playwright test
      - name: 上传测试报告（失败时留痕）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend:
    name: 后端导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 导入后端（捕获语法错误、坏 import、模块级异常）
        # backend.main 在导入时不会连数据库、也不会下载模型，
        # 这两件事都发生在 FastAPI lifespan 里，所以纯导入是安全且快速的冒烟检查。
        run: python -c "import backend.main; print('backend import OK')"
