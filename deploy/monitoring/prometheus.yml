global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: novel-rag
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    scrape_timeout: 25s
    static_configs:
      - targets: [gateway:8000]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
